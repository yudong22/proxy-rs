[package]
name = "proxy-rs-gui"
version = "1.7.0"
edition = "2021"
description = "Proxy RS Desktop GUI"

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `time` is used directly by `await_start_outcome` to report a failed bind.
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", features = ["http2"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
anyhow = "1.0"
proxy-rs = { path = ".." }

[build-dependencies]
tauri-build = { version = "2", features = [] }
