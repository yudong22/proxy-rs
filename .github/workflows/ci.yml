name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # `build.rs` compiles the console into the binary from `ui-dist/` and
      # panics without it, so every cargo invocation below needs the front-end
      # built first. This is not optional setup: without it `cargo fmt` runs but
      # `cargo clippy`/`cargo test` fail in the build script, on a message about
      # missing UI assets that has nothing to do with the Rust change.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install front-end deps
        run: npm ci

      - name: Build front-end (ui-dist/)
        run: npm run build:ui

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The lib tests mutate process-global environment (`HOME`,
      # `PROXY_DATA_DIR`) and therefore rely on locks to serialise. A lock that
      # was accidentally split let two tests race for months: it passed locally
      # because the scheduler happened to interleave them safely, and failed on
      # every CI run the moment the machine got faster.
      #
      # This is the parallel configuration the race needs to appear, run
      # repeatedly. `cargo test` already runs tests in parallel, so one pass is
      # usually enough — the repetition is what turns "usually" into evidence.
      # It is a few seconds of a job that has already compiled everything.
      - name: Test (parallel, repeated — catches env-var races)
        run: |
          for i in 1 2 3; do
            echo "--- lib tests, pass $i ---"
            cargo test --lib -- --test-threads=16
          done

      # The headless server is a separate bin from the desktop app and nothing
      # else on Linux compiles it — a change that breaks it would otherwise only
      # surface at release time (or, worse, on the operator's server).
      - name: Build headless server
        run: cargo build --release --bin proxy-rs-server

  # The front-end checks. Separate from `rust` because they need no Rust at all
  # and fail for different reasons, so a UI regression does not serialise behind
  # a 10-minute compile.
  #
  # Both suites run: `check-ui` is static and instant, `smoke` boots the real
  # page in headless Chrome. The smoke step passes CHROME_PATH explicitly —
  # without it the harness prints SKIPPED and exits 0, which on CI would be a
  # green tick over a suite that never ran.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install front-end deps
        run: npm ci

      - name: Build front-end (ui-dist/)
        run: npm run build:ui

      - name: Static checks (cascade, imports, ids)
        run: npm run check:ui

      - name: Build-output checks (console route prefixes, entry tag, preflight)
        run: npm run check:dist

      # Source tree, then the shipped bundle: the same assertions twice, because
      # a module split or cascade reorder can be clean in one and broken in the
      # other, and only the bundle is what actually ships.
      #
      # `SMOKE_REQUIRED` turns the harness's "no Chrome, skip with exit 0" path
      # into a failure. On this image Chrome exists, so the guard is for the day
      # the image stops shipping it — a silently skipped suite is a green tick
      # over nothing.
      - name: Smoke (source)
        run: npm run smoke
        env:
          SMOKE_REQUIRED: '1'

      - name: Smoke (built bundle)
        run: npm run smoke:dist
        env:
          SMOKE_REQUIRED: '1'

  # The server console, end to end: build the real `proxy-rs-server`, start it,
  # log in through the actual login form, and drive the real front-end against
  # it in headless Chrome.
  #
  # `admin-smoke.mjs` has existed for a long time and was never run by CI — the
  # one test that exercises "the gateway serves the console it compiled in" was
  # opt-in and manual. The gap it left is exactly where 3.5.0 broke: the console
  # page was served, but the window's start page was not built.
  admin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install front-end deps
        run: npm ci

      - name: Build front-end (ui-dist/)
        run: npm run build:ui

      - name: Build headless server
        run: cargo build --bin proxy-rs-server

      - name: Start the gateway
        run: |
          set -eu
          DATA="$(mktemp -d)"
          PROXY_DATA_DIR="$DATA" PROXY_API_TOKEN=ci-smoke-token \
          PROXY_BIND=127.0.0.1 ./target/debug/proxy-rs-server > "$DATA/server.log" 2>&1 &
          echo $! > "$DATA/server.pid"
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3456/health" >/dev/null 2>&1; then
              echo "gateway is up"; exit 0
            fi
            sleep 0.5
          done
          echo "::error::the gateway never answered /health"
          cat "$DATA/server.log"
          exit 1

      - name: Server console smoke (real gateway, real login)
        run: node ui/tools/admin-smoke.mjs
        env:
          BASE: http://127.0.0.1:3456
          TOKEN: ci-smoke-token
          SMOKE_REQUIRED: '1'
