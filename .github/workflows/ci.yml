name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The headless server is a separate bin from the desktop app and nothing
      # else on Linux compiles it — a change that breaks it would otherwise only
      # surface at release time (or, worse, on the operator's server).
      - name: Build headless server
        run: cargo build --release --bin proxy-rs-server
