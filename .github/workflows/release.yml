name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    strategy:
      # One unrunnable leg blocks the whole release: `release` needs this matrix
      # to finish, so anything that never gets a runner (a deprecated pool, a
      # starved label) holds every artifact hostage. Keep every entry to a pool
      # that actually provisions.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. The Intel leg (`macos-13`,
          # x86_64-apple-darwin) was removed: GitHub's `macos-13` pool is
          # deprecated and starved, so the job sat queued with no runner ever
          # assigned. Because `release` needs this matrix to finish, one
          # unrunnable leg held the whole release hostage — v1.3.0's GitHub
          # Release was blocked by it.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-aarch64
            # `-b app` (the macOS `.app` bundle) is what npm's build script
            # does; the dmg adds the installer around it.
            build_args: -b dmg
            artifact_glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

          # Windows desktop build. Two things differ from the macOS leg and
          # both are load-bearing:
          #
          #   1. `-b app` is a macOS-only bundle target. On Windows Tauri
          #      produces `msi` (WiX) and/or `nsis` executables instead, so the
          #      bundle kinds are named explicitly here rather than relying on
          #      `bundle.targets` in tauri.conf.json — that file currently lists
          #      `["app"]`, which is meaningless for this leg and would make the
          #      build emit nothing.
          #   2. The target triple must be passed explicitly; `windows-latest`
          #      is x86_64 so the default would work, but pinning it keeps the
          #      artifact path below correct even if the runner image changes.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
            build_args: --bundles msi,nsis
            artifact_glob: |
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri CLI
        run: npm ci

      # Both legs go through the same invocation: the Tauri CLI is invoked
      # directly (not through npm's `build`/`build:dmg` scripts) because those
      # bake in `-b app`, which only macOS understands. `--bundles` is passed
      # explicitly on both legs so neither depends on `tauri.conf.json`.
      - name: Build desktop app and installer
        run: npx tauri build --target ${{ matrix.target }} ${{ matrix.build_args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # A glob that matches nothing fails the upload, which is what we want:
          # a leg that "succeeded" while producing no installer is a broken
          # release, not a warning.
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  release:
    needs: [build-tauri]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        # Printed before the upload so a missing platform is visible in the log
        # of the run that created the release, not discovered by a user who
        # downloaded it.
        run: ls -laR artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*

# The `publish` job (crates.io) was removed: `CARGO_REGISTRY_TOKEN` was never
# configured in this repository, so every tag push failed the whole run with
# "please provide a non-empty token". Re-add it once the secret actually
# exists — crates.io is meanwhile stuck at 1.2.0 because of this.
