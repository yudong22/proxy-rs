name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    strategy:
      # One unrunnable leg blocks the whole release: `release` needs this matrix
      # to finish, so anything that never gets a runner (a deprecated pool, a
      # starved label) holds every artifact hostage. Keep every entry to a pool
      # that actually provisions.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. The Intel leg (`macos-13`,
          # x86_64-apple-darwin) was removed: GitHub's `macos-13` pool is
          # deprecated and starved, so the job sat queued with no runner ever
          # assigned. Because `release` needs this matrix to finish, one
          # unrunnable leg held the whole release hostage — v1.3.0's GitHub
          # Release was blocked by it.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-aarch64
            # `-b app` (the macOS `.app` bundle) is what npm's build script
            # does; the dmg adds the installer around it.
            build_args: -b dmg
            artifact_glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

          # Windows desktop build. Two things differ from the macOS leg and
          # both are load-bearing:
          #
          #   1. `-b app` is a macOS-only bundle target. On Windows Tauri
          #      produces `msi` (WiX) and/or `nsis` executables instead, so the
          #      bundle kinds are named explicitly here rather than relying on
          #      `bundle.targets` in tauri.conf.json — that file currently lists
          #      `["app"]`, which is meaningless for this leg and would make the
          #      build emit nothing.
          #   2. The target triple must be passed explicitly; `windows-latest`
          #      is x86_64 so the default would work, but pinning it keeps the
          #      artifact path below correct even if the runner image changes.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
            build_args: --bundles msi,nsis
            artifact_glob: |
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri CLI
        run: npm ci

      # Both legs go through the same invocation: the Tauri CLI is invoked
      # directly (not through npm's `build`/`build:dmg` scripts) because those
      # bake in `-b app`, which only macOS understands. `--bundles` is passed
      # explicitly on both legs so neither depends on `tauri.conf.json`.
      - name: Build desktop app and installer
        run: npx tauri build --target ${{ matrix.target }} ${{ matrix.build_args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # A glob that matches nothing fails the upload, which is what we want:
          # a leg that "succeeded" while producing no installer is a broken
          # release, not a warning.
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  # The headless Linux server binary.
  #
  # Separate from `build-tauri` because it needs none of the desktop toolchain:
  # no Tauri CLI, no Node, no macOS/Windows SDK. It is a plain Rust build of the
  # `proxy-rs-server` bin, and it is what a Linux deployment actually installs —
  # before this job existed the release shipped only `.dmg`/`.msi`/`.exe`, so a
  # server operator had to install a Rust toolchain just to get the binary.
  #
  # `x86_64-unknown-linux-gnu` rather than musl: the target machines are stock
  # Alibaba Cloud Linux / Debian / Ubuntu, all glibc, and the build runs on the
  # oldest supported runner image to keep the required glibc floor low.
  build-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-linux-x64

      - name: Build headless server
        run: cargo build --release --bin proxy-rs-server --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          set -eu
          BIN=target/x86_64-unknown-linux-gnu/release/proxy-rs-server
          test -x "$BIN" || { echo "::error::proxy-rs-server was not produced"; exit 1; }
          mkdir -p dist
          # Name carries the arch: a release page with three differently-built
          # Linux binaries and no arch in the names is a download lottery.
          cp "$BIN" dist/proxy-rs-server-linux-x64
          # The unit and the vhost ship beside the binary so a deploy does not
          # depend on reading the repo: this is the whole server deployment kit.
          cp deploy/linux/proxy-rs.service dist/
          cp deploy/linux/api.wuba.site.conf dist/
          cp deploy/linux/README.md dist/
          ( cd dist && sha256sum proxy-rs-server-linux-x64 > proxy-rs-server-linux-x64.sha256 )
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          if-no-files-found: error
          path: dist/*

  release:
    needs: [build-tauri, build-server]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        # Printed before the upload so a missing platform is visible in the log
        # of the run that created the release, not discovered by a user who
        # downloaded it.
        run: ls -laR artifacts

      # Flatten before uploading.
      #
      # `upload-artifact` preserves the directory structure relative to the
      # glob's common prefix, and the two Windows globs (`msi/*.msi` and
      # `nsis/*.exe`) have *different* leaf directories, so their common prefix
      # stops one level up and the files arrive as `artifacts/msi/…` and
      # `artifacts/nsis/…`. `gh release create artifacts/*` then expands to
      # those two directories and dies with:
      #
      #   read artifacts/msi: is a directory
      #
      # `gh` only uploads files, so collecting the installer files into one flat
      # directory first makes the glob platform-independent: adding another
      # bundling target later cannot reintroduce nested directories here.
      - name: Collect installers into one flat directory
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp -v {} dist/ \;
          # The Linux server kit. Caught by name, not by extension: the binary has
          # none, and a missing server artifact must fail the same way a missing
          # installer does.
          find artifacts -type f \( \
              -name 'proxy-rs-server-linux-x64*' \
              -o -name 'proxy-rs.service' \
              -o -name 'api.wuba.site.conf' \
            \) -exec cp -v {} dist/ \;
          echo "--- collected ---"
          ls -la dist
          # A release with no installer is a broken release, not a warning.
          count=$(find dist -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::没有收集到任何安装包，检查构建产物路径"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a re-run of the same tag (after a transient failure, or
          # when the tag was moved) must replace the release rather than fail on
          # "release already exists". `create` cannot overwrite, so an existing
          # release is deleted first and recreated from the fresh artifacts.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} 已存在，删除后重建"
            gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*

# The `publish` job (crates.io) was removed: `CARGO_REGISTRY_TOKEN` was never
# configured in this repository, so every tag push failed the whole run with
# "please provide a non-empty token". Re-add it once the secret actually
# exists — crates.io is meanwhile stuck at 1.2.0 because of this.
