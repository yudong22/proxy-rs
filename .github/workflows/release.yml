name: Release

# Only `v*` tags publish. The pattern used to be `*`, so *any* tag — a
# throwaway marker, a date, a `test-...` tag someone pushed to see the workflow
# run — created a public GitHub Release with installers attached. Version tags
# are the only ones this repository uses for releasing (`v3.5.2`, ...), so the
# trigger matches that and nothing else.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    strategy:
      # One unrunnable leg blocks the whole release: `release` needs this matrix
      # to finish, so anything that never gets a runner (a deprecated pool, a
      # starved label) holds every artifact hostage. Keep every entry to a pool
      # that actually provisions.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. The Intel leg (`macos-13`,
          # x86_64-apple-darwin) was removed: GitHub's `macos-13` pool is
          # deprecated and starved, so the job sat queued with no runner ever
          # assigned. Because `release` needs this matrix to finish, one
          # unrunnable leg held the whole release hostage — v1.3.0's GitHub
          # Release was blocked by it.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-aarch64
            # `-b app` (the macOS `.app` bundle) is what npm's build script
            # does; the dmg adds the installer around it.
            build_args: -b dmg
            artifact_glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

          # Windows desktop build. Two things differ from the macOS leg and
          # both are load-bearing:
          #
          #   1. `-b app` is a macOS-only bundle target. On Windows Tauri
          #      produces `msi` (WiX) and/or `nsis` executables instead, so the
          #      bundle kinds are named explicitly here rather than relying on
          #      `bundle.targets` in tauri.conf.json — that file currently lists
          #      `["app"]`, which is meaningless for this leg and would make the
          #      build emit nothing.
          #   2. The target triple must be passed explicitly; `windows-latest`
          #      is x86_64 so the default would work, but pinning it keeps the
          #      artifact path below correct even if the runner image changes.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
            build_args: --bundles msi,nsis
            artifact_glob: |
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri CLI
        run: npm ci

      # Both legs go through the same invocation: the Tauri CLI is invoked
      # directly (not through npm's `build`/`build:dmg` scripts) because those
      # bake in `-b app`, which only macOS understands. `--bundles` is passed
      # explicitly on both legs so neither depends on `tauri.conf.json`.
      #
      # ## Why this retries
      #
      # The Windows leg's last step is *not* compilation — it is the bundler
      # downloading its WiX toolchain from a GitHub release asset
      # (`wix314-binaries.zip`). That download is the only part of the job that
      # depends on a third party being up, and on v3.5.3 it failed four times in
      # a row with `failed to bundle project: http status: 502/503/504` while
      # `cargo` had already printed `Finished release profile in 6m 52s`. The
      # Rust build was complete and correct every time; only the download died.
      #
      # A transient 5xx from the asset CDN is not a defect in this repository, so
      # failing the release on the first one is wrong — worse, it blocks the
      # whole `release` job (it `needs` this matrix), so the macOS and Linux
      # artifacts that *did* build are never published. Retrying the command is
      # enough: cargo's own artifacts are cached, so an attempt after a failed
      # download resumes near the bundling step rather than recompiling.
      #
      # `-b app`/`--bundles` make a re-run safe: the bundler overwrites its
      # output directory, and `upload-artifact` runs only after a success.
      - name: Build desktop app and installer
        run: |
          set -eu
          attempt=1
          max=4
          while :; do
            if npx tauri build --target ${{ matrix.target }} ${{ matrix.build_args }}; then
              exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::tauri build failed after $max attempts"
              exit 1
            fi
            echo "::warning::tauri build attempt $attempt failed (bundler toolchain download); retrying in 30s"
            attempt=$((attempt + 1))
            sleep 30
          done
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # A glob that matches nothing fails the upload, which is what we want:
          # a leg that "succeeded" while producing no installer is a broken
          # release, not a warning.
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  # The headless Linux server binary.
  #
  # Separate from `build-tauri` because it needs none of the desktop toolchain:
  # no Tauri CLI, no macOS/Windows SDK. It is a plain Rust build of the
  # `proxy-rs-server` bin, and it is what a Linux deployment actually installs —
  # before this job existed the release shipped only `.dmg`/`.msi`/`.exe`, so a
  # server operator had to install a Rust toolchain just to get the binary.
  #
  # It *does* need Node: `build.rs` compiles the admin console into the binary
  # from `ui-dist/`, and panics without it. Skipping that here made this job —
  # and therefore the whole release, since `release` needs it — fail inside a
  # build script, with a message about missing UI assets and no hint that a
  # front-end build was the missing step.
  #
  # **`x86_64-unknown-linux-musl`, statically linked.**
  #
  # The obvious choice was `-gnu` (dynamic glibc), and it shipped that way in
  # v3.2.0 with a real defect: the runner's glibc becomes the binary's floor. The
  # GitHub `ubuntu-22.04` image has glibc 2.35, which merged libpthread into libc
  # and renamed those symbols at version 2.34 — verified with `objdump -T` on the
  # published artifact, it required `GLIBC_2.34` and therefore would not start on
  # Ubuntu 20.04 (2.31), Debian 11 (2.31) or RHEL 8 (2.28).
  #
  # The fix cannot be "build on an older runner": `ubuntu-20.04` was fully retired
  # in April 2025, and pinning it would hang the release exactly the way the
  # deprecated `macos-13` leg once did. Static musl removes the question entirely —
  # no glibc version to satisfy, and it also works on Alpine.
  #
  # The cost is that musl links a different allocator (mallocng), which is slower
  # under heavy multithreaded allocation. For a proxy whose work is dominated by
  # network I/O that is not measurable here, and portability is worth more than a
  # benchmark win on one distro.
  build-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The console is compiled into this binary; `build.rs` refuses to build
      # without `ui-dist/`. See the job comment.
      - name: Install front-end deps
        run: npm ci

      - name: Build front-end (ui-dist/)
        run: npm run build:ui

      # musl needs a C toolchain that targets it: `rusqlite` (bundled SQLite) and
      # `ring` both compile C, and the default gcc does not emit musl binaries.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-linux-x64

      - name: Build headless server
        run: |
          # `ring` needs the C compiler pointed at musl explicitly.
          export CC_x86_64_unknown_linux_musl=musl-gcc
          export AR_x86_64_unknown_linux_musl=ar
          cargo build --release --bin proxy-rs-server --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          set -eu
          BIN=target/x86_64-unknown-linux-musl/release/proxy-rs-server
          test -x "$BIN" || { echo "::error::proxy-rs-server was not produced"; exit 1; }

          STAGE=proxy-rs-server-linux-x64
          rm -rf "$STAGE" dist
          mkdir -p "$STAGE" dist
          # Name carries the arch: a release page with several Linux binaries and
          # no arch in the names is a download lottery.
          install -m 755 "$BIN" "$STAGE/proxy-rs-server"
          # The unit and an EXAMPLE vhost ship inside the archive so a deploy does
          # not depend on reading the repo. They are one bundle rather than three
          # loose files on the release page: an operator deploying a server wants
          # the whole kit, and a bare binary next to a config they have to find in
          # the source tree is exactly the friction this is meant to remove.
          install -m 644 deploy/linux/proxy-rs.service "$STAGE/"
          install -m 644 deploy/linux/api.wuba.site.conf "$STAGE/nginx-site.conf.example"
          install -m 644 deploy/linux/README.md "$STAGE/DEPLOY.md"
          tar -czf "dist/$STAGE.tar.gz" "$STAGE"

          ( cd dist && sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256" )
          file "$STAGE/proxy-rs-server"
          ls -la dist

      # Prove the artifact is *statically linked*, which is the actual fix.
      #
      # v3.2.0 shipped `-gnu` and required GLIBC_2.34, so it refused to start on
      # Ubuntu 20.04, Debian 11, RHEL 8 and Alibaba Cloud Linux 3.
      #
      # **Which of the original three checks kept, and why not the others.**
      # `file` was only logging (its output is reproduced by `ldd` below), so it
      # is gone. The `objdump -T` check is the one that actually caught v3.2.0 —
      # a *dynamic* binary that links glibc still lists `GLIBC_2.34` as a symbol
      # requirement, and that is the precise defect, not "is it dynamic". `ldd`
      # is kept as the fast, obvious signal; `objdump` is kept because it is the
      # evidence the defect leaves behind, and dropping it would be trading the
      # one check with a proven catch for nothing.
      - name: Verify the artifact is statically linked
        run: |
          set -eu
          BIN=proxy-rs-server-linux-x64/proxy-rs-server
          echo "--- ldd ---"
          ldd "$BIN" || true
          if ldd "$BIN" 2>&1 | grep -qE 'libc\.so|libpthread|GLIBC'; then
            echo "::error::the Linux artifact is dynamically linked; it must be static musl"
            exit 1
          fi
          # The defect v3.2.0 shipped: glibc symbol-version requirements. A
          # static musl binary has none.
          if objdump -T "$BIN" 2>/dev/null | grep -q 'GLIBC_[0-9]'; then
            echo "::error::the artifact carries GLIBC symbol-version requirements"
            objdump -T "$BIN" | grep 'GLIBC_' | head
            exit 1
          fi
          echo "static-linking checks passed"

      - name: Smoke-test the artifact on the build runner
        run: |
          set -eu
          chmod +x proxy-rs-server-linux-x64/proxy-rs-server
          export PROXY_DATA_DIR="$RUNNER_TEMP/smoke-data"
          export PROXY_API_TOKEN=smoke-token
          export PROXY_BIND=127.0.0.1
          export PORT=3456
          mkdir -p "$PROXY_DATA_DIR"
          ./proxy-rs-server-linux-x64/proxy-rs-server > "$RUNNER_TEMP/gateway.log" 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:3456/health" >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::the gateway exited before answering /health"
              cat "$RUNNER_TEMP/gateway.log"
              exit 1
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::the gateway never answered /health"
            cat "$RUNNER_TEMP/gateway.log"
            exit 1
          fi

          # A 200 on /health proves the process is alive; prove the admin console
          # was compiled in too, since that is the feature this build exists for.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3456/admin/login")
          if [ "$code" != "200" ]; then
            echo "::error::admin login page returned $code"
            exit 1
          fi
          echo "artifact smoke test passed (health=200, admin/login=$code)"

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          if-no-files-found: error
          path: dist/*

  release:
    needs: [build-tauri, build-server]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        # Printed before the upload so a missing platform is visible in the log
        # of the run that created the release, not discovered by a user who
        # downloaded it.
        run: ls -laR artifacts

      # Flatten before uploading.
      #
      # `upload-artifact` preserves the directory structure relative to the
      # glob's common prefix, and the two Windows globs (`msi/*.msi` and
      # `nsis/*.exe`) have *different* leaf directories, so their common prefix
      # stops one level up and the files arrive as `artifacts/msi/…` and
      # `artifacts/nsis/…`. `gh release create artifacts/*` then expands to
      # those two directories and dies with:
      #
      #   read artifacts/msi: is a directory
      #
      # `gh` only uploads files, so collecting the installer files into one flat
      # directory first makes the glob platform-independent: adding another
      # bundling target later cannot reintroduce nested directories here.
      - name: Collect installers into one flat directory
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp -v {} dist/ \;
          # The Linux server kit. Caught by name, not by extension: the binary has
          # none, and a missing server artifact must fail the same way a missing
          # installer does.
          find artifacts -type f \( \
              -name 'proxy-rs-server-linux-x64.tar.gz*' \
            \) -exec cp -v {} dist/ \;
          echo "--- collected ---"
          ls -la dist
          # A release with no installer is a broken release, not a warning.
          count=$(find dist -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::没有收集到任何安装包，检查构建产物路径"
            exit 1
          fi

      # The two version gates that v3.5.2 needed and did not have.
      #
      # v3.5.2 shipped a `.dmg` whose `Info.plist` said 3.5.2 while the binary
      # inside reported 3.5.1 — the console header showed **v3.5.1**. Nothing
      # failed anywhere: the bundle built from `tauri.conf.json`, the console
      # label came from `src-tauri/Cargo.toml` via `env!("CARGO_PKG_VERSION")`,
      # and the two files had silently drifted. This step runs *before* the
      # release is created, so the run goes red instead of publishing a package
      # that misreports itself.
      #
      #   1. `v$version` must equal the tag. A tag that does not match the code it
      #      points at is the same class of lie one level up.
      #   2. `tauri.conf.json` (what the installer is named/stamped) must equal
      #      `src-tauri/Cargo.toml` (what the binary inside reports).
      #
      # `node` is on the runner (setup-node is not needed for this: the ubuntu
      # image ships node, and the other jobs already rely on it). Reading JSON
      # with node avoids `jq` assumptions.
      #
      # Note this gate is *this job's* last line of defence. The same equality is
      # also asserted on every push by `tests/release_consistency.rs`, which is
      # where the drift should be caught — this one exists because a release can
      # be built from a commit that never ran CI.
      - name: Verify the tag matches the version being packaged
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The whole check is one node program, so there is no shell string
          # handling between reading the files and comparing them: no command
          # substitution, no `$(...)`-inside-heredoc parsing, nothing to quote.
          # It exits non-zero on either mismatch, which fails the job before
          # `Create release` runs.
          node - <<'NODE'
          const fs = require('fs');

          const ref = process.env.REF_NAME || '';
          const fail = (msg) => {
            console.error(`::error::${msg}`);
            process.exit(1);
          };

          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          if (!conf.version) {
            fail('src-tauri/tauri.conf.json 没有 version 字段，无法校验发布版本');
          }

          // Only the `[package]` table carries the crate's own version; a
          // dependency's `version = "1.0"` must not be mistaken for it.
          const toml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const pkgTable = toml.split(/^\[package\]$/m)[1];
          if (!pkgTable) {
            fail('src-tauri/Cargo.toml 没有 [package] 表，无法校验 GUI crate 版本');
          }
          const beforeNextTable = pkgTable.split(/^\[/m)[0];
          const m = beforeNextTable.match(/^\s*version\s*=\s*"([^"]+)"/m);
          if (!m) {
            fail('src-tauri/Cargo.toml 的 [package] 表没有 version');
          }

          const packaged = conf.version;
          const consoleVersion = m[1];

          console.log(`tag              = ${ref}`);
          console.log(`tauri.conf.json  = ${packaged}`);
          console.log(`src-tauri crate  = ${consoleVersion}`);

          // (2) The pair that drifted in v3.5.2: the installer version and the
          // version the binary inside reports about itself.
          if (consoleVersion !== packaged) {
            fail(
              `src-tauri/tauri.conf.json (${packaged}) 与 src-tauri/Cargo.toml ` +
                `(${consoleVersion}) 版本不一致。安装包版本取前者，控制台显示的版本由后者经 ` +
                `env!(CARGO_PKG_VERSION) 编进二进制 —— v3.5.2 就是这个事故：` +
                `dmg 是 3.5.2，控制台显示 v3.5.1。`
            );
          }

          // (1) The tag must name the version the artifacts carry.
          if (`v${packaged}` !== ref) {
            fail(
              `tag ${ref} 与 src-tauri/tauri.conf.json 的 version ${packaged} 不匹配` +
                `（期望 tag v${packaged}）。请先统一版本再打 tag。`
            );
          }

          console.log(`版本闸门通过：tag、安装包版本、GUI crate 版本三者一致 (${ref})`);
          NODE

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a re-run of the same tag (after a transient failure, or
          # when the tag was moved) must replace the release rather than fail on
          # "release already exists". `create` cannot overwrite, so an existing
          # release is deleted first and recreated from the fresh artifacts.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} 已存在，删除后重建"
            gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*

# The `publish` job (crates.io) was removed: `CARGO_REGISTRY_TOKEN` was never
# configured in this repository, so every tag push failed the whole run with
# "please provide a non-empty token". Re-add it once the secret actually
# exists — crates.io is meanwhile stuck at 1.2.0 because of this.
