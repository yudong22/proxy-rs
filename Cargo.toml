[package]
name = "proxy-rs"
version = "3.5.1"
edition = "2021"
authors = [
    "yudong22 (孙东) <3cking@163.com>",
    "m0n0x41d (Ivan Zakutnii) <zakutnii.ivan@gmail.com>",
]
description = "High-performance AI protocol proxy (Anthropic Messages / OpenAI Responses & Chat) to OpenAI-compatible endpoints"
license = "MIT"
repository = "https://github.com/yudong22/anthropic-proxy-rs"

[lib]
name = "proxy_rs"
path = "src/lib.rs"

[workspace]
members = [
    "src-tauri",
]

[dependencies]
# Async runtime. `time` enables the interval the daily check-in scheduler ticks on.
# `signal` is what the headless binary uses to drain in-flight requests on
# SIGTERM; the desktop app has no signal handling of its own.
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
tokio-util = "0.7"

# Web framework
axum = { version = "0.7", features = ["http2"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async utilities
futures = "0.3"
async-stream = "0.3"

# Observability
tracing = "0.1"
# Only the headless server binary (`src/bin/proxy-rs-server.rs`) installs a
# subscriber: the desktop app's formatting comes from Tauri's own setup. It is
# declared here because a direct use has to be declared to be legal, and the
# binary links against this crate rather than `proxy-rs-gui`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Substring/line sanitization of outbound request bodies (port of Go sanitize.go
# rewrite table so fingerprints in user/assistant/tool content and reasoning are
# neutralized before they reach the upstream content filter).
regex = "1"

# Environment variables
dotenvy = "0.15"

# Server utilities
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Async streams
bytes = "1.9"

# SQLite persistence for daily statistics
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2.189"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

# Optional passphrase encryption for the account-pool transfer file
# (`src/pool_transfer.rs`). Argon2id derives the key, AES-256-GCM both encrypts
# and authenticates, so a tampered or truncated file fails to decrypt rather
# than importing half a pool. All three are pure Rust — no C toolchain, which
# matters because the release profile is `panic = "abort"` and shipped as a
# self-contained `.app`.
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"

# Directory walk for the Claude Code session browser (`src/claude_sessions.rs`).
# Only depth-1 iteration is used; `walkdir` is here because it skips symlinks by
# default and reports per-entry errors instead of aborting the whole walk on one
# unreadable project directory.
walkdir = "2"

# SHA-256 for the client-access-key store (`src/client_accounts.rs`).
#
# Only the *hash* of an inbound key is persisted, so a leaked state file cannot
# be replayed against the gateway. sha2 is already in the tree (argon2/aes-gcm
# pull it in), so declaring it adds no new dependency graph — but a direct use
# still has to be declared to be legal.
sha2 = "0.10"

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Enable Link Time Optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols for smaller binary
panic = "abort"        # Smaller binary

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
