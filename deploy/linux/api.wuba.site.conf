# Proxy RS 网关 —— api.wuba.site 反向代理
#
# 由宝塔面板管理站点时请放到 /www/server/panel/vhost/nginx/api.wuba.site.conf，
# 面板会自动 include 该目录下的 *.conf。
#
# ## 这个站点暴露什么
#
#   客户端 ──HTTPS──► nginx:443 ──HTTP──► 网关 127.0.0.1:3456
#
# 只放行数据面，三个内部命名空间一律 404：
#
#   · /v1/*                 客户端协议（messages / responses / chat completions / models / credits）
#   · /responses 等无前缀别名 部分客户端直接用无前缀路径
#   · /                     公网首页（使用说明，不涉及任何凭据）
#
#   · /api/*                网关自身观测与管理接口（NEW: 含 POST /api/scheduler/run）
#   · /metrics              Prometheus 指标
#   · /health               存活探针
#
# `/api/*` 里有一条**会改上游账号状态**的 POST。网关侧已有令牌校验，但那是
# 第二道锁：把整个命名空间在反代层挡掉，外部就根本看不到这把锁存在。
#
# ## 为什么必须关掉缓冲
#
# SSE 是流式协议。nginx 默认 `proxy_buffering on`，会把上游增量攒起来，
# 客户端要等整轮生成结束才收到第一帧 —— 表现为「流式不流」。`proxy_buffering off`
# 是这一种部署里最关键的一行，比任何超时设置都重要。
#
# ## 超时
#
# 网关侧上游读超时是 300s（reqwest `read_timeout`）。反代超时必须**不短于**它，
# 否则 nginx 会先掐断一条网关仍在等上游的长回复。这里给 600s，留一倍余量。

server {
    listen 80;
    listen [::]:80;
    server_name api.wuba.site;

    # ACME HTTP-01 验证目录必须放行，否则证书续期会失败。
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/api.wuba.site;
        default_type text/plain;
        allow all;
    }

    # 其余一律跳 HTTPS。`$host$request_uri` 保留原始 Host，避免跳转到 IP。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.wuba.site;

    root /www/wwwroot/api.wuba.site;
    index index.html;

    # 证书由宝塔面板签发/续期（Let's Encrypt）。路径与面板约定一致，
    # 面板换证书不需要改这个文件。
    ssl_certificate     /www/server/panel/vhost/cert/api.wuba.site/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.wuba.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:api_wuba_site:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 请求体上限。网关自己的 `PROXY_MAX_BODY_BYTES` 默认 32 MiB，用于长会话；
    # 反代这一层必须**不小于**它，否则大请求在到达网关之前就被 413 掉，
    # 而网关日志里什么都不会留下 —— 排查时最容易被误判成客户端的问题。
    client_max_body_size 40m;
    client_body_buffer_size 1m;

    # 不对外暴露 nginx 版本号。
    server_tokens off;

    # ── 内部命名空间：直接 404 ─────────────────────────────────────────────
    # `^~` 让前缀匹配优先于下面的正则，且不再尝试正则 location。
    location ^~ /api/    { return 404; }
    location = /metrics  { return 404; }
    location = /health   { return 404; }

    # ── 公网首页 ───────────────────────────────────────────────────────────
    # 静态使用说明，不含任何凭据。`try_files` 落到 index.html，因此访问
    # 不存在的路径也返回首页而不是 404 —— 但只在非 /v1 前缀下才这样。
    location = / {
        add_header Cache-Control "public, max-age=3600" always;
        try_files /index.html =404;
    }
    location = /favicon.ico { access_log off; return 204; }

    # ── 数据面 ─────────────────────────────────────────────────────────────
    # 用一个具名 location 承载全部上游转发，避免四段一模一样的配置各自漂移。
    location ~ ^/(v1/|responses|chat/completions|backend-api/) {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;

        # SSE 的关键。没有这一行，流式响应会被攒成一整块。
        proxy_buffering off;
        proxy_cache off;
        # 让 nginx 在收到上游第一字节时就把响应头发出去，而不是等 body。
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 透传客户端身份与协议信息。`Host` 用原始域名，网关日志才有意义。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 访问密钥与上游鉴权头必须原样透传。nginx 默认会转发这些，但显式写出来
        # 是为了让「谁负责鉴权」这件事在配置里可见：网关负责，nginx 只搬。
        proxy_pass_request_headers on;
    }

    # ── 兜底 ───────────────────────────────────────────────────────────────
    location / { return 404; }

    access_log /www/wwwlogs/api.wuba.site.log;
    error_log  /www/wwwlogs/api.wuba.site.error.log;
}
