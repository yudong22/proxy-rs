# Proxy RS 网关 —— api.wuba.site 反向代理
#
# 由宝塔面板管理站点时请放到 /www/server/panel/vhost/nginx/api.wuba.site.conf，
# 面板会自动 include 该目录下的 *.conf。
#
# ## 这个站点暴露什么
#
#   客户端 ──HTTPS──► nginx:443 ──HTTP──► 网关 127.0.0.1:3456
#
# 只放行数据面，三个内部命名空间一律 404：
#
#   · /v1/*                 客户端协议（messages / responses / chat completions / models / credits）
#   · /responses 等无前缀别名 部分客户端直接用无前缀路径
#   · /                     公网首页（使用说明，不涉及任何凭据）
#
#   · /api/*                网关自身观测与管理接口（NEW: 含 POST /api/scheduler/run）
#   · /metrics              Prometheus 指标
#   · /health               存活探针
#
# `/api/*` 里有一条**会改上游账号状态**的 POST。网关侧已有令牌校验，但那是
# 第二道锁：把整个命名空间在反代层挡掉，外部就根本看不到这把锁存在。
#
# ## 为什么必须关掉缓冲
#
# SSE 是流式协议。nginx 默认 `proxy_buffering on`，会把上游增量攒起来，
# 客户端要等整轮生成结束才收到第一帧 —— 表现为「流式不流」。`proxy_buffering off`
# 是这一种部署里最关键的一行，比任何超时设置都重要。
#
# ## 超时
#
# 网关侧上游读超时是 300s（reqwest `read_timeout`）。反代超时必须**不短于**它，
# 否则 nginx 会先掐断一条网关仍在等上游的长回复。这里给 600s，留一倍余量。

server {
    listen 80;
    listen [::]:80;
    server_name api.wuba.site;

    # ACME HTTP-01 验证目录必须放行，否则证书续期会失败。
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/api.wuba.site;
        default_type text/plain;
        allow all;
    }

    # 其余一律跳 HTTPS。`$host$request_uri` 保留原始 Host，避免跳转到 IP。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.wuba.site;

    root /www/wwwroot/api.wuba.site;
    index index.html;

    # 证书由宝塔面板签发/续期（Let's Encrypt）。路径与面板约定一致，
    # 面板换证书不需要改这个文件。
    ssl_certificate     /www/server/panel/vhost/cert/api.wuba.site/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.wuba.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:api_wuba_site:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 请求体上限。网关自己的 `PROXY_MAX_BODY_BYTES` 默认 32 MiB，用于长会话；
    # 反代这一层必须**不小于**它，否则大请求在到达网关之前就被 413 掉，
    # 而网关日志里什么都不会留下 —— 排查时最容易被误判成客户端的问题。
    client_max_body_size 40m;
    client_body_buffer_size 1m;

    # 不对外暴露 nginx 版本号。
    server_tokens off;

    # ── 只读观测接口：直接 404 ─────────────────────────────────────────────
    # `/api/*` 是给本机 dashboard 读的只读观测面，无鉴权（设计如此），所以它
    # 必须在反代层挡住 —— 网关自己不会拒绝它。
    # `^~` 让前缀匹配优先于下面的正则，且不再尝试正则 location。
    location ^~ /api/    { return 404; }
    location = /metrics  { return 404; }
    location = /health   { return 404; }

    # ── 公网首页 ───────────────────────────────────────────────────────────
    # 静态使用说明，不含任何凭据。`try_files` 落到 index.html，因此访问
    # 不存在的路径也返回首页而不是 404 —— 但只在非 /v1 前缀下才这样。
    location = / {
        add_header Cache-Control "public, max-age=3600" always;
        try_files /index.html =404;
    }
    location = /favicon.ico { access_log off; return 204; }

    # ── 数据面 ─────────────────────────────────────────────────────────────
    # 用一个具名 location 承载全部上游转发，避免四段一模一样的配置各自漂移。
    location ~ ^/(v1/|responses|chat/completions|backend-api/) {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;

        # SSE 的关键。没有这一行，流式响应会被攒成一整块。
        proxy_buffering off;
        proxy_cache off;
        # 让 nginx 在收到上游第一字节时就把响应头发出去，而不是等 body。
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 透传客户端身份与协议信息。`Host` 用原始域名，网关日志才有意义。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 访问密钥与上游鉴权头必须原样透传。nginx 默认会转发这些，但显式写出来
        # 是为了让「谁负责鉴权」这件事在配置里可见：网关负责，nginx 只搬。
        proxy_pass_request_headers on;
    }

    # ── 管理台 ─────────────────────────────────────────────────────────────
    # `/admin/api/*` 是浏览器用的管理面：登录换 Cookie 会话，之后可改上游凭据、
    # 增删访问密钥。它**自己有鉴权**（PROXY_API_TOKEN 换会话），所以这里可以放行；
    # 上面 404 的是 `/api/*`，两者是不同命名空间，不要混。
    #
    # 注意这与 `/api/` 的规则互不干扰：`^~` 前缀比较的是完整段，`/admin/api/*`
    # 并不以 `/api/` 开头。
    #
    # 管理台不走 SSE，也不需要长超时，用一套普通的反代参数即可。
    #
    # 路径映射：网关把控制台挂在 `/admin/api`，对外暴露成 `/admin` 更自然。
    #
    # **两条 location，不能合并成一条 rewrite。** 控制台页面自己的 API 基址是
    # 绝对的 `/admin/api`，如果只写一条 `^/admin/(.*)$ → /admin/api/$1`，那么
    # 页面发出的 `/admin/api/session` 会被再前缀一次变成
    # `/admin/api/api/session`，登录后整个控制台都 404。
    # nginx 选最长前缀匹配，所以把 `/admin/api/` 单独一条「原样转发」即可。
    location ^~ /admin/api/ {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 网关据此决定会话 Cookie 要不要带 `Secure`。缺了它，HTTPS 下的
        # 浏览器会收到不带 Secure 的 Cookie（能用，但弱一些）。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        # 管理台页面带版本，别让浏览器缓存住旧的控制台逻辑。
        proxy_buffering off;
    }

    # 页面与静态资源：`/admin/` → `/admin/api/`、`/admin/console.js` →
    # `/admin/api/console.js`。这条只处理页面前缀，不碰上面那条已经匹配的
    # `/admin/api/*`。
    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ /admin/api/$1 break;
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }
    # 裸 /admin（无斜杠）也要落到控制台，否则用户输地址就 404。
    location = /admin {
        return 301 https://$host/admin/;
    }

    # ── 兜底 ───────────────────────────────────────────────────────────────
    location / { return 404; }

    access_log /www/wwwlogs/api.wuba.site.log;
    error_log  /www/wwwlogs/api.wuba.site.error.log;
}
