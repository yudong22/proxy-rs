version: '3'

# Deliberately small. Two things are used day to day — installing the desktop
# app and the UI hot-reload loop — plus the tasks they cannot run without.
#
# Everything else (fmt / lint / test / check / watch / audit / doc / bench /
# release …) was removed: each is a single cargo or npm command, and a task list
# that mirrors the toolchain is one more place to keep in sync. Run the command
# directly, or let CI (`ci.yml`) run the full gate on every push.

vars:
  APP_NAME: Proxy RS
  APP_BIN: proxy-rs-gui
  BUNDLE_DIR: target/release/bundle/macos
  INSTALL_APP: /Applications/{{.APP_NAME}}.app

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ── Desktop app ──────────────────────────────────────────────────────────
  # Dependency of `install` and `build`: the pinned Tauri CLI, plus Vite and
  # Tailwind for the front-end. `npm ci` also drives `build.rs`, which compiles
  # the console from `ui-dist/` and fails without it.
  setup:
    desc: Install Node dev dependencies (Tauri CLI, Vite, Tailwind)
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci

  build:
    desc: Build the Tauri 2 GUI desktop app (.app)
    aliases: [gui-build]
    deps: [setup]
    cmds:
      - npm run build

  install:
    desc: Build the .app and replace {{.INSTALL_APP}} (restarts it if running)
    aliases: [gui-install, local-install]
    deps: [build]
    cmds:
      - |
        TARGET_APP="{{.BUNDLE_DIR}}/{{.APP_NAME}}.app"

        WAS_RUNNING=0
        if pgrep -x "{{.APP_BIN}}" > /dev/null 2>&1 || pgrep -afil "{{.APP_NAME}}.app" > /dev/null 2>&1; then
          WAS_RUNNING=1
          echo "🔄 Stopping running {{.APP_NAME}}..."
          killall "{{.APP_BIN}}" 2>/dev/null || true
          pkill -afil "{{.APP_NAME}}.app" 2>/dev/null || true
          sleep 1
        fi

        echo "📦 Installing to {{.INSTALL_APP}}..."
        rm -rf "{{.INSTALL_APP}}"
        cp -R "${TARGET_APP}" "{{.INSTALL_APP}}"

        if [ $WAS_RUNNING -eq 1 ]; then
          echo "🚀 Restarting {{.APP_NAME}}..."
          open "{{.INSTALL_APP}}"
        fi
        echo "✅ Installed to {{.INSTALL_APP}}"

  # ── Front-end dev loop ───────────────────────────────────────────────────
  # `ui-dev` proxies to a real gateway, so it needs one running. `dev-server`
  # is that gateway; run it in a second terminal. (It is a dependency in
  # spirit, not in `deps:` — it must stay in the foreground, so `deps:` would
  # block `ui-dev` from ever starting.)
  #
  # ## The port lives here, in one place
  #
  # The desktop runs **two** listeners: the data plane (`port`, serves
  # `/api/*`) and the console (`port + 1`, serves `/admin/*`). `ui-dev` has to
  # proxy each prefix to its own port, so both sides must agree on the number.
  #
  # The gateway reads its port from `$PROXY_DATA_DIR/gui-settings.json`, which
  # is why this task writes that file before starting: otherwise a stale value
  # in `~/.proxy-rs-dev` (or the default 3456) silently disagreed with what
  # vite.config.js proxied to, and half the console 404'd.
  dev-server:
    desc: Run the headless gateway locally for `task ui-dev` (builds the server once)
    vars:
      PROXY_PORT: '3457'
    cmds:
      - cargo build --bin proxy-rs-server
      - |
        DEV_DIR="$HOME/.proxy-rs-dev"
        mkdir -p "$DEV_DIR"
        # Always rewrite the port: a leftover file from an older run is exactly
        # how the two sides drifted apart.
        node -e '
          const fs = require("fs");
          const p = process.argv[1];
          let s = {};
          try { s = JSON.parse(fs.readFileSync(p, "utf8")); } catch {}
          s.port = Number(process.argv[2]);
          fs.writeFileSync(p, JSON.stringify(s, null, 2) + "\n");
        ' "$DEV_DIR/gui-settings.json" {{.PROXY_PORT}}
        echo "🧪 proxy    : http://127.0.0.1:{{.PROXY_PORT}}  (/api/*)"
        echo "🧪 console  : http://127.0.0.1:{{add .PROXY_PORT 1}}  (/admin/*)"
        PROXY_DATA_DIR="$DEV_DIR" PROXY_API_TOKEN=dev ./target/debug/proxy-rs-server

  ui-dev:
    desc: UI hot-reload loop; switch 测试/生产 backend from the DEV badge in the page
    vars:
      # Keep in step with dev-server's PROXY_PORT. `ui-dev` only proxies; it
      # does not start the gateway, so the two tasks cannot share a var.
      PROXY_PORT: '3457'
      # The installed desktop app's data plane. Its console is one port up.
      PROD_PORT: '3457'
    cmds:
      - |
        DEV_PROXY_PORT={{.PROXY_PORT}} PROD_PROXY_PORT={{.PROD_PORT}} \
        node ui/tools/dev.mjs
